# Release di Orbit da GitHub Actions: lo stesso scripts/New-Release.ps1 delle release fatte in locale (stessi
# controlli, stessi installer firmati), con la chiave di firma nei secret dell'environment "release" invece che
# su un PC. Così si pubblica da qualunque PC, o dal sito.
#
# Due fasi (M75):
#   1. build: Windows (NSIS e MSI) e Linux (AppImage, .deb e .rpm, su Ubuntu 22.04 perché giri anche sulle
#      distribuzioni con una glibc meno recente), ognuna col suo latest.json;
#   2. release: scripts/Publish-Release.ps1 unisce i due latest.json, controlla che ci sia ogni formato, scrive
#      il PKGBUILD per Arch e, con publish, crea la release. Senza publish è una prova a secco: gli stessi file
#      restano come artefatto dell'esecuzione.
#
# Si lancia solo a mano, mai da una pull request (il repo è pubblico):
#   - dal sito: Actions → Release → Run workflow;
#   - da un terminale: gh workflow run release.yml -f title="…" -f publish=true
# L'environment "release" vale solo per main e aspetta l'approvazione del maintainer prima di dare i secret ai
# due job di build (una sola approvazione, per l'environment, li sblocca entrambi). Il percorso completo è in
# docs/11-release.md.
name: Release
run-name: Release ${{ inputs.publish && '(publish)' || '(dry run)' }}

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release title after "Orbit vX.Y.Z — " (empty: just "Orbit vX.Y.Z")'
        type: string
        required: false
      publish:
        description: "Publish the release on GitHub (off: dry run, the files stay as this run's artifact)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # azioni solo di GitHub, fissate per commit (la versione nel commento): il job vede la chiave di firma
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Publish-Release.ps1 controlla che il commit sia già su GitHub (origin/*)
          persist-credentials: false # repo pubblico: il git fetch dello script non ha bisogno del token

      - name: Linux libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev patchelf file xdg-utils

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
            !src-tauri/target/release/bundle
          key: release-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      # prima dei secret: se mancano le note della versione, l'esecuzione si ferma qui
      - name: Release notes from NOTES.md
        id: notes
        run: |
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $path = ./scripts/Get-ReleaseNotes.ps1 -OutFile (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Orbit $version - note della release:"
          Get-Content -LiteralPath $path

      - name: Signing key to a temporary file
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Manca il secret TAURI_SIGNING_PRIVATE_KEY nell''environment "release".' }
          # Trim: un a capo finale, aggiunto passando il file a gh secret set, non fa parte della chiave
          $path = Join-Path $env:RUNNER_TEMP 'orbit-updater.key'
          [IO.File]::WriteAllText($path, $env:SIGNING_KEY.Trim())
          "KEY_PATH=$path" >> $env:GITHUB_ENV

      - name: New-Release.ps1
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Manca il secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD nell''environment "release".' }
          ./scripts/New-Release.ps1 -Notes $env:NOTES_PATH -KeyPath $env:KEY_PATH

      - name: Remove the signing key
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'orbit-updater.key') -Force -ErrorAction SilentlyContinue

      # le misure della build firmata, per la sezione della versione in NOTES.md (anche nel riepilogo dell'esecuzione)
      - name: Sizes
        run: |
          $files = if ($IsWindows) {
            Get-Item src-tauri/target/release/orbit.exe, artifacts/release/*.exe, artifacts/release/*.msi
          } else {
            Get-Item src-tauri/target/release/orbit, artifacts/release/*.AppImage, artifacts/release/*.deb, artifacts/release/*.rpm
          }
          $rows = $files | ForEach-Object { '| `{0}` | {1:N2} MiB |' -f $_.Name, ($_.Length / 1MB) }
          $rows | ForEach-Object { Write-Host $_ }
          @('| File | Size |', '|---|---|') + $rows | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload artifacts/release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-${{ steps.notes.outputs.version }}-${{ matrix.platform }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag e release, con gh
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release notes from NOTES.md
        id: notes
        run: |
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $path = ./scripts/Get-ReleaseNotes.ps1 -OutFile (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: orbit-${{ steps.notes.outputs.version }}-*
          path: ${{ runner.temp }}/builds

      - name: Publish-Release.ps1
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          TITLE: ${{ inputs.title }}
          PUBLISH: ${{ inputs.publish }}
          BUILDS: ${{ runner.temp }}/builds
        run: |
          # gli input passano dall'ambiente, mai scritti dentro lo script: un titolo non può diventare codice
          $params = @{ Dir = $env:BUILDS; OutDir = 'artifacts/release'; Notes = $env:NOTES_PATH }
          if ($env:TITLE) { $params.Title = $env:TITLE }
          if ($env:PUBLISH -eq 'true') { $params.Publish = $true }
          ./scripts/Publish-Release.ps1 @params

      - name: Upload the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-${{ steps.notes.outputs.version }}-${{ inputs.publish && 'published' || 'dry-run' }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
