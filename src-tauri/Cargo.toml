[package]
name = "orbit"
version = "0.8.6"
description = "Orbit — a lightweight IDE, companion for Claude Code"
authors = ["visialab"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Il suffisso `_lib` rende il nome della lib unico e non in conflitto col bin (necessario su Windows).
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": abilita le webview FIGLIE (Window::add_child) — serve al pannello Usage embedded
# (claude.ai ancorata nella finestra come un popover). Feature flag di una dipendenza già presente,
# nessuna dipendenza nuova.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2" # folder/file picker nativo (apri cartella)
tauri-plugin-clipboard-manager = "2" # clipboard affidabile lato Rust (fuori dai limiti di WebView2)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# git2 senza default-features: solo operazioni LOCALI (no https/ssh -> niente openssl/libssh2)
git2 = { version = "0.20", default-features = false }
# terminale: PTY reale cross-platform (ConPTY su Windows)
portable-pty = "0.8"
# streaming byte-accurate dell'output PTY verso il frontend
base64 = "0.22"
# file watcher (albero + git in tempo reale)
notify = "6"

# Liveness dei pid: recupero post-crash della sessione multi-finestra (scarta le voci di processi
# morti, che altrimenti bloccherebbero il "riapri tutte"). Versioni GIÀ presenti nell'albero come
# dipendenze transitive → costo di compilazione nullo. Cfg-gated per piattaforma.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
# Logout locale del pannello Usage: cancellazione cookie via ICoreWebView2CookieManager
# (nessuna richiesta di rete). Entrambi GIÀ nell'albero come transitive di tauri, stesse
# versioni del lock → costo di compilazione nullo.
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Profilo release ottimizzato per footprint minimo (gate #1: leggerezza).
[profile.release]
opt-level = "s"   # ottimizza per dimensione
lto = true        # link-time optimization
codegen-units = 1 # massimizza l'ottimizzazione (build più lenta)
panic = "abort"   # niente unwinding: binario più piccolo
strip = true      # rimuove i simboli di debug
