<style data-doc-runtime="0.2">

   Generated by inline-runtime.sh: don't edit it here, run the script again to refresh it. */

main>section[data-layout]{display:grid;gap:var(--gap,1rem) calc(var(--gap,1rem)*1.5);align-items:start}
main>section[data-layout=stack]{grid-template-columns:minmax(0,1fr)}
main>section[data-layout=split]{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
main>section[data-layout=grid-2]{grid-template-columns:repeat(2,minmax(0,1fr))}

.dr-total{fill:var(--fg,currentColor);font-size:20px;font-weight:600}
.dr-legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin:.5rem 0 0;font-size:.85em;color:var(--muted,inherit)}
.dr-legend i{display:inline-block;width:.75em;height:.75em;border-radius:2px;margin-right:.4em;vertical-align:-.05em}

</style>
<script data-doc-runtime="0.2">
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const lang = document.documentElement.lang || undefined;
  const color = (i) => "var(--dr-" + ((i % 6) + 1) + ")";
  const fmt = (v, unit) => (typeof v === "number" ? v.toLocaleString(lang, { maximumFractionDigits: 2 }) : String(v)) + (unit || "");
  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  const tip = (e, text) => el("title", {}, e, text);

  function toc() {
    for (const nav of $$('[data-generated="toc"]')) {
      nav.textContent = "";
      const ol = document.createElement("ol");
      for (const s of $$("main > section[data-block][id]")) {
        const h = s.querySelector("h1, h2, h3");
        if (!h) continue;
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#" + s.id;
        a.textContent = h.textContent.trim();
        li.appendChild(a);
        ol.appendChild(li);
      }
      nav.appendChild(ol);
    }
  }

  function dataset(name, scope) {
    if (!name) return null;
    const sel = 'script[type="application/json"][data-dataset="' + CSS.escape(name) + '"]';
    const s = (scope && scope.querySelector(sel)) || document.querySelector(sel);
    if (!s) return null;
    try {
      const d = JSON.parse(s.textContent);
      return d && Array.isArray(d.columns) && Array.isArray(d.rows) ? d : null;
    } catch (e) {
      return null;
    }
  }

  function ticks(lo, hi, n) {
    if (lo === hi) hi = lo + 1;
    const raw = (hi - lo) / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
    const out = [];
    for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(10));
    return out;
  }

  function legend(out, items) {
    const l = document.createElement("div");
    l.className = "dr-legend";
    for (const [name, c] of items) {
      const s = document.createElement("span");
      const i = document.createElement("i");
      i.style.background = c;
      s.append(i, name);
      l.appendChild(s);
    }
    out.appendChild(l);
  }

  // somme per categoria (barre impilate: contano i valori positivi)
  const totals = (series, n) => Array.from({ length: n }, (_, i) => series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0));
  const maxLen = (arr) => Math.max(0, ...arr.map((x) => String(x).length));

  function xy(out, W, type, labels, series, unit, opt) {
    const H = opt.height || Math.round(Math.min(380, Math.max(220, W * 0.42)));
    const n = labels.length;
    const stacked = opt.stacked && type === "bar";
    const all = stacked ? totals(series, n) : series.flatMap((s) => s.values);
    const t = ticks(Math.min(0, ...all), Math.max(0, ...all), 5);
    const lo = t[0];
    const hi = t[t.length - 1];
    const tl = t.map((v) => fmt(v, unit));
    const ml = Math.min(96, 14 + maxLen(tl) * 7);
    const mr = 12, mt = 14, mb = 30;
    const iw = W - ml - mr, ih = H - mt - mb;
    const y = (v) => mt + ih - ((v - lo) / (hi - lo)) * ih;
    const root = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, out);
    const ax = el("g", { class: "dr-axis" }, root);
    t.forEach((v, i) => {
      el("line", { class: "dr-grid", x1: ml, x2: W - mr, y1: y(v), y2: y(v) }, ax);
      el("text", { x: ml - 6, y: y(v) + 4, "text-anchor": "end" }, ax, tl[i]);
    });
    const band = iw / n;
    const lw = 14 + maxLen(labels) * 7; // larghezza stimata dell'etichetta più lunga
    const every = Math.ceil(n / Math.max(1, Math.floor(iw / lw)));
    labels.forEach((l, i) => {
      if (i % every === 0) el("text", { x: ml + band * (i + 0.5), y: H - mb + 19, "text-anchor": "middle" }, ax, l);
    });
    const vw = maxLen(all.map((v) => fmt(v, unit))) * 6.2; // ≈ larghezza di un valore a 11 px
    if (type === "line" || type === "area") {
      series.forEach((s) => {
        const pts = s.values.map((v, i) => [ml + band * (i + 0.5), y(v)]);
        if (type === "area") {
          const base = y(Math.max(lo, 0));
          const d = "M" + pts.map((p) => p.join(",")).join("L") + `L${pts[pts.length - 1][0]},${base}L${pts[0][0]},${base}Z`;
          el("path", { d, style: `fill:${s.color};opacity:.18` }, root);
        }
        el("polyline", { points: pts.map((p) => p.join(",")).join(" "), style: `fill:none;stroke:${s.color};stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round` }, root);
        pts.forEach((p, i) => tip(el("circle", { cx: p[0], cy: p[1], r: 3.5, style: `fill:${s.color}` }, root), `${s.name} · ${labels[i]}: ${fmt(s.values[i], unit)}`));
      });
    } else if (stacked) {
      const pad = band * 0.3;
      const bw = band - pad;
      const sums = totals(series, n);
      for (let i = 0; i < n; i++) {
        let acc = 0;
        const x = ml + band * i + pad / 2;
        series.forEach((s) => {
          const v = Math.max(0, s.values[i] || 0);
          if (!v) return;
          const r = el("rect", { x, y: y(acc + v), width: Math.max(1, bw - 1), height: Math.max(0, y(acc) - y(acc + v)), style: `fill:${s.color}` }, root);
          tip(r, `${s.name} · ${labels[i]}: ${fmt(v, unit)}`);
          acc += v;
        });
        if (n <= 16 && bw - 4 >= vw) el("text", { class: "dr-value", x: x + bw / 2, y: y(sums[i]) - 5, "text-anchor": "middle" }, root, fmt(sums[i], unit));
      }
    } else {
      const k = series.length;
      const pad = band * 0.22;
      const bw = (band - pad) / k;
      const showValues = n * k <= 16 && bw - 4 >= vw; // i valori sopra le barre solo se ci stanno senza toccarsi
      series.forEach((s, j) =>
        s.values.forEach((v, i) => {
          const x = ml + band * i + pad / 2 + bw * j;
          const y0 = y(0), y1 = y(v);
          const r = el("rect", { x, y: Math.min(y0, y1), width: Math.max(1, bw - 2), height: Math.abs(y1 - y0), rx: 2, style: `fill:${s.color}` }, root);
          tip(r, `${s.name} · ${labels[i]}: ${fmt(v, unit)}`);
          if (showValues) el("text", { class: "dr-value", x: x + (bw - 2) / 2, y: v >= 0 ? y1 - 5 : y1 + 13, "text-anchor": "middle" }, root, fmt(v, unit));
        }),
      );
    }
    el("line", { class: "dr-zero", x1: ml, x2: W - mr, y1: y(0), y2: y(0) }, root);
  }

  function hbar(out, W, labels, series, unit, opt) {
    const k = opt.stacked ? 1 : series.length;
    const n = labels.length;
    const rowH = Math.max(26, 14 * k + 12);
    const ml = Math.min(W * 0.4, 16 + maxLen(labels) * 7);
    const fit = Math.max(4, Math.floor((ml - 14) / 7)); // caratteri che stanno a sinistra delle barre
    const mr = 64, mt = 4;
    const H = mt * 2 + rowH * n;
    const all = opt.stacked ? totals(series, n) : series.flatMap((s) => s.values);
    const t = ticks(Math.min(0, ...all), Math.max(0, ...all), 4);
    const lo = t[0], hi = t[t.length - 1];
    const iw = W - ml - mr;
    const x = (v) => ml + ((v - lo) / (hi - lo)) * iw;
    const root = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, out);
    const ax = el("g", { class: "dr-axis" }, root);
    labels.forEach((l, i) => {
      const top = mt + rowH * i;
      const lab = el("text", { x: ml - 8, y: top + rowH / 2 + 4, "text-anchor": "end" }, ax, l.length > fit ? l.slice(0, fit - 1) + "…" : l);
      if (l.length > fit) tip(lab, l);
      const bh = (rowH - 10) / k;
      if (opt.stacked) {
        let acc = 0;
        series.forEach((s) => {
          const v = Math.max(0, s.values[i] || 0);
          if (!v) return;
          const r = el("rect", { x: x(acc), y: top + 5, width: Math.max(1, x(acc + v) - x(acc) - 1), height: Math.max(1, bh - 2), style: `fill:${s.color}` }, root);
          tip(r, `${s.name} · ${l}: ${fmt(v, unit)}`);
          acc += v;
        });
        el("text", { class: "dr-value", x: x(acc) + 5, y: top + 5 + bh / 2 + 3 }, root, fmt(acc, unit));
        return;
      }
      series.forEach((s, j) => {
        const v = s.values[i];
        const yy = top + 5 + bh * j;
        const r = el("rect", { x: Math.min(x(0), x(v)), y: yy, width: Math.max(1, Math.abs(x(v) - x(0))), height: Math.max(1, bh - 2), rx: 2, style: `fill:${s.color}` }, root);
        tip(r, `${s.name} · ${l}: ${fmt(v, unit)}`);
        el("text", { class: "dr-value", x: Math.max(x(0), x(v)) + 5, y: yy + bh / 2 + 3 }, root, fmt(v, unit));
      });
    });
    el("line", { class: "dr-zero", x1: x(0), x2: x(0), y1: mt, y2: H - mt }, root);
  }

  function pie(out, W, labels, s, unit, donut) {
    const H = Math.round(Math.min(300, Math.max(200, W * 0.42)));
    const r = H / 2 - 6, ri = donut ? r * 0.58 : 0;
    const cx = W / 2, cy = H / 2;
    const vals = s.values.map((v) => Math.max(0, v));
    const tot = vals.reduce((a, b) => a + b, 0) || 1;
    const root = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" }, out);
    const pt = (a, rr) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    let a0 = -Math.PI / 2;
    vals.forEach((v, i) => {
      if (!v) return;
      const a1 = a0 + (v / tot) * Math.PI * 2;
      const style = `fill:${color(i)};stroke:var(--bg,#fff);stroke-width:2`;
      let shape;
      if (v / tot > 0.9999) {
        shape = el("circle", { cx, cy, r, style }, root);
        if (donut) el("circle", { cx, cy, r: ri, style: "fill:var(--bg,#fff)" }, root);
      } else {
        const big = a1 - a0 > Math.PI ? 1 : 0;
        const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
        let d = `M${x0},${y0}A${r},${r} 0 ${big} 1 ${x1},${y1}`;
        if (donut) {
          const [x2, y2] = pt(a1, ri), [x3, y3] = pt(a0, ri);
          d += `L${x2},${y2}A${ri},${ri} 0 ${big} 0 ${x3},${y3}Z`;
        } else d += `L${cx},${cy}Z`;
        shape = el("path", { d, style }, root);
      }
      tip(shape, `${labels[i]}: ${fmt(v, unit)} (${Math.round((v / tot) * 100)}%)`);
      if (v / tot >= 0.06) {
        const [lx, ly] = pt((a0 + a1) / 2, donut ? (r + ri) / 2 : r * 0.62);
        el("text", { class: "dr-slice", x: lx, y: ly + 4, "text-anchor": "middle" }, root, Math.round((v / tot) * 100) + "%");
      }
      a0 = a1;
    });
    if (donut) el("text", { class: "dr-total", x: cx, y: cy + 7, "text-anchor": "middle" }, root, fmt(tot, unit));
  }

  function chart(fig) {
    const type = fig.dataset.chart || "bar";
    let out = fig.querySelector('[data-generated="chart"]');
    if (!out) {
      out = document.createElement("div");
      out.setAttribute("data-generated", "chart");
      fig.insertBefore(out, fig.firstChild);
    }
    out.textContent = "";
    const d = dataset(fig.dataset.source, fig.closest("section"));
    const empty = (msg) => {
      const e = document.createElement("div");
      e.className = "dr-empty";
      e.textContent = msg;
      out.appendChild(e);
    };
    if (!d || !d.rows.length) return empty("No data: " + (fig.dataset.source || "data-source missing"));
    const cols = d.columns.map(String);
    const xi = Math.max(0, cols.indexOf(fig.dataset.x || cols[0]));
    const ys = fig.dataset.y
      ? fig.dataset.y.split(",").map((c) => cols.indexOf(c.trim())).filter((i) => i >= 0)
      : cols.map((_, i) => i).filter((i) => i !== xi && d.rows.some((r) => typeof r[i] === "number"));
    if (!ys.length) return empty("No numeric column in " + fig.dataset.source);
    const labels = d.rows.map((r) => String(r[xi] ?? ""));
    const series = ys.map((i, k) => ({ name: cols[i], color: color(k), values: d.rows.map((r) => (typeof r[i] === "number" ? r[i] : Number(r[i]) || 0)) }));
    const unit = fig.dataset.unit || "";
    const W = Math.max(280, Math.round(out.clientWidth || fig.clientWidth || 640));
    const opt = { stacked: fig.hasAttribute("data-stacked"), height: Math.max(0, Number(fig.dataset.height) || 0) };
    const round = type === "pie" || type === "donut";
    if (round) pie(out, W, labels, series[0], unit, type === "donut");
    else if (type === "hbar") hbar(out, W, labels, series, unit, opt);
    else xy(out, W, type, labels, series, unit, opt);
    if (round) legend(out, labels.map((l, i) => [l, color(i)]));
    else if (series.length > 1) legend(out, series.map((s) => [s.name, s.color]));
    widths.set(fig, Math.round(fig.clientWidth));
  }

  const widths = new WeakMap();
  const charts = () => $$("figure[data-chart]");
  function renderCharts(onlyResized) {
    for (const f of charts()) {
      if (onlyResized && widths.get(f) === Math.round(f.clientWidth)) continue;
      try {
        chart(f);
      } catch (e) {
        console.error("doc-runtime chart", e);
      }
    }
  }
  function render() {
    toc();
    renderCharts(false);
  }

  let timer = 0;
  const later = () => {
    clearTimeout(timer);
    timer = setTimeout(() => renderCharts(true), 120);
  };
  function start() {
    render();
    themeToggle();
    if ("ResizeObserver" in window) {
      const ro = new ResizeObserver(later);
      charts().forEach((f) => ro.observe(f));
    } else window.addEventListener("resize", later);
    window.addEventListener("beforeprint", () => renderCharts(true));
    window.addEventListener("afterprint", () => renderCharts(true));
  }
  // Tema chiaro/scuro: un interruttore che accende o spegne i blocchi @media (prefers-color-scheme: dark) del
  // documento, gli stessi che il browser usa da sé. Senza scelta segue il sistema; la scelta si ricorda per
  // documento. <html data-theme-toggle="off"> lo toglie. La stampa resta chiara (i blocchi sono «screen»).
  function themeToggle() {
    if (document.documentElement.getAttribute("data-theme-toggle") === "off") return;
    const rules = [];
    for (const sheet of Array.from(document.styleSheets)) {
      let list;
      try {
        list = sheet.cssRules;
      } catch (e) {
        continue;
      }
      for (const r of Array.from(list)) if (r.media && /prefers-color-scheme\s*:\s*dark/i.test(r.media.mediaText)) rules.push({ rule: r, text: r.media.mediaText });
    }
    if (!rules.length) return;
    const it = /^it\b/i.test(lang || "");
    const key = "doc-theme:" + location.pathname;
    const sys = window.matchMedia("(prefers-color-scheme: dark)");
    let choice = null;
    try {
      choice = localStorage.getItem(key);
    } catch (e) {}
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dr-theme";
    const isDark = () => (choice ? choice === "dark" : sys.matches);
    const apply = () => {
      for (const d of rules) d.rule.media.mediaText = choice === "light" ? "not all" : choice === "dark" ? "screen" : d.text;
      const dark = isDark();
      btn.textContent = dark ? "\u2600" : "\u263E";
      btn.title = dark ? (it ? "Tema chiaro" : "Light theme") : it ? "Tema scuro" : "Dark theme";
      btn.setAttribute("aria-label", btn.title);
    };
    btn.addEventListener("click", () => {
      choice = isDark() ? "light" : "dark";
      if ((choice === "dark") === sys.matches) choice = null; // di nuovo come il sistema
      try {
        if (choice) localStorage.setItem(key, choice);
        else localStorage.removeItem(key);
      } catch (e) {}
      apply();
    });
    if (sys.addEventListener) sys.addEventListener("change", apply);
    document.body.appendChild(btn);
    apply();
  }

  window.docRuntime = { version: "0.2", render };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
